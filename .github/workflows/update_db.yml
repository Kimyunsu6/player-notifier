name: 선수 사전 갱신

on:
  schedule:
    # 매주 월요일 한국 14:00 (UTC 05:00) - 경기 없는 시간
    - cron: "0 5 * * 1"
  workflow_dispatch:

# last_update.txt를 커밋하려면 쓰기 권한 필요
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests python-dotenv

      - name: 선수 사전 만들고 KV에 올리기
        run: python -u build_player_db.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}

      - name: 갱신 기록 커밋 (60일 규칙 대비)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add last_update.txt
          git commit -m "선수 사전 자동 갱신" || echo "변경 없음"
          git push